<body>

    <portfolio-app>
        <div class="content__all">

            <div class="content__1">
                <hero-section title="Contact me!"
                    description="I would be very happy if you left a feedback."></hero-section>

            <div class="content__2">

                <form action="https://formsubmit.co/9bf0513dad95dc076f725c58aac4c039" method="POST" autocomplete="off">

                    <input type="text" name="_honey" style="display:none">
                    <input type="hidden" name="_next" value="butykadavid.github.io/thankyou.html">
                    <input type="hidden" name="_next" value="https://butykadavid.github.io/thankyou.html">
                    <textarea class="message" type="text" name="message" rows="8" required
                        placeholder="Message"></textarea>
                    <div>
                        <button type="button" id="clearBtn">Clear</button>
                        <button type="submit">Send</button>
                    </div>
                </form>
            </div>

        </div>
    </portfolio-app>
